name: momento_app
description: "엄마의 요리법을 음성으로 기록하고 AI로 정리하는 감성 요리 아카이빙 앱"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # HTTP Client
  http: ^1.1.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  image_picker: ^1.0.4
  image_cropper: ^5.0.1

  # JSON Serialization
  json_annotation: ^4.8.1

  # UI Utilities
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4
  cached_network_image: ^3.3.1

  # Date & Time
  intl: ^0.20.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.2

  # Speech-to-Text
  speech_to_text: ^7.2.0

  # OCR
  google_mlkit_text_recognition: ^0.10.0

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # In-App Purchase
  in_app_purchase: ^3.1.13
  
  # Share functionality
  share_plus: ^11.0.0
  qr_flutter: ^4.1.0

  # Charts
  fl_chart: ^0.68.0

  # HTML parsing for URL extraction
  html: ^0.15.4

  # YouTube API
  googleapis: ^13.1.0
  googleapis_auth: ^1.4.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^3.0.0

  # Testing
  mockito: ^5.4.4

dependency_overrides:
  record_linux: ^1.1.1

flutter:
  uses-material-design: true
  
  # Enable internationalization
  generate: true

  assets:
    - assets/images/

  # fonts:
  #   - family: NotoSansKR
  #     fonts:
  #       - asset: assets/fonts/NotoSansKR-Regular.ttf
  #       - asset: assets/fonts/NotoSansKR-Bold.ttf
  #         weight: 700
  #
  # (launcher icon config moved to top-level below)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon/app_icon.png
  remove_alpha_ios: true
